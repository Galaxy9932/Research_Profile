<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="100%" height="100%" opacity="0.12">
  <defs>
    <pattern id="spacetime-grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-dasharray="2,4"/>
    </pattern>
  </defs>
  
  <!-- Subtle spacetime curvature grid -->
  <rect width="100%" height="100%" fill="url(#spacetime-grid)" />

  <!-- Bubble chamber particle tracks (curving prongs in magnetic field) -->
  <g stroke="#60a5fa" stroke-width="1.2" fill="none">
    <path d="M 120 850 C 180 700, 320 580, 480 500 C 600 440, 780 430, 920 480" />
    <path d="M 480 500 C 510 380, 580 290, 680 220 C 760 170, 880 140, 980 130" />
    <path d="M 480 500 C 450 410, 410 340, 350 280 C 290 230, 210 190, 140 170" />
    <!-- Spiral track (electron in B-field) -->
    <path d="M 920 480 C 950 490, 970 470, 960 450 C 945 425, 915 435, 920 460 C 925 475, 945 480, 955 470" />
  </g>

  <!-- Feynman Diagram 1: Four-Fermi Weak Interaction (Contact vertex) -->
  <g transform="translate(150, 120)" stroke="#f472b6" stroke-width="1.8" fill="none">
    <!-- incoming fermions -->
    <line x1="0" y1="0" x2="80" y2="80" />
    <polygon points="45,35 40,48 53,43" fill="#f472b6" />
    <line x1="0" y1="160" x2="80" y2="80" />
    <polygon points="40,112 45,125 53,117" fill="#f472b6" />
    <!-- vertex -->
    <circle cx="80" cy="80" r="5" fill="#f472b6" stroke="#ffffff" stroke-width="1"/>
    <!-- outgoing fermions -->
    <line x1="80" y1="80" x2="160" y2="0" />
    <polygon points="120,40 115,27 128,32" fill="#f472b6" />
    <line x1="80" y1="80" x2="160" y2="160" />
    <polygon points="115,133 120,120 128,128" fill="#f472b6" />
    <text x="88" y="75" fill="#f472b6" font-family="monospace" font-size="12" stroke="none">G_F</text>
  </g>

  <!-- Feynman Diagram 2: One-Loop Vacuum Polarization / Bubble -->
  <g transform="translate(1100, 550)" stroke="#38bdf8" stroke-width="1.8" fill="none">
    <!-- incoming photon/boson wave -->
    <path d="M 0 60 Q 15 45, 30 60 T 60 60 T 90 60" />
    <!-- fermion loop -->
    <circle cx="140" cy="60" r="50" />
    <polygon points="140,10 132,18 148,18" fill="#38bdf8" />
    <polygon points="140,110 148,102 132,102" fill="#38bdf8" />
    <!-- outgoing photon wave -->
    <path d="M 190 60 Q 205 45, 220 60 T 250 60 T 280 60" />
    <text x="130" y="65" fill="#38bdf8" font-family="monospace" font-size="11" stroke="none">1-loop</text>
  </g>

  <!-- Gravitational Wave Tensor perturbation symbol -->
  <g transform="translate(1150, 160)" stroke="#a855f7" stroke-width="1.5" fill="none">
    <path d="M 0 30 Q 30 0, 60 30 T 120 30 T 180 30 T 240 30" />
    <path d="M 0 50 Q 30 20, 60 50 T 120 50 T 180 50 T 240 50" opacity="0.6"/>
    <text x="60" y="85" fill="#a855f7" font-family="monospace" font-size="13" stroke="none">c_T = c (GW170817)</text>
  </g>
</svg>
