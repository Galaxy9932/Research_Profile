<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 220" width="100%" height="auto">
  <rect width="100%" height="100%" fill="#0f172a" rx="8"/>
  
  <!-- Sub-panel A: Four-Fermi Contact Interaction -->
  <g transform="translate(20, 25)">
    <text x="0" y="15" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="bold">(a) Fermi 4-Fermion Contact Vertex</text>
    <g stroke="#38bdf8" stroke-width="2" fill="none">
      <line x1="20" y1="40" x2="90" y2="100" />
      <line x1="20" y1="160" x2="90" y2="100" />
      <line x1="90" y1="100" x2="160" y2="40" />
      <line x1="90" y1="100" x2="160" y2="160" />
      <circle cx="90" cy="100" r="6" fill="#f43f5e" stroke="#ffffff" stroke-width="1.5"/>
    </g>
    <text x="10" y="38" fill="#94a3b8" font-size="11">e⁻</text>
    <text x="10" y="165" fill="#94a3b8" font-size="11">ν_μ</text>
    <text x="165" y="38" fill="#94a3b8" font-size="11">μ⁻</text>
    <text x="165" y="165" fill="#94a3b8" font-size="11">ν_e</text>
    <text x="100" y="98" fill="#f43f5e" font-family="monospace" font-size="11" font-weight="bold">G_F</text>
  </g>

  <!-- Divider -->
  <line x1="240" y1="20" x2="240" y2="200" stroke="#334155" stroke-dasharray="4,4"/>

  <!-- Sub-panel B: 1-Loop Electroweak Regularization -->
  <g transform="translate(260, 25)">
    <text x="0" y="15" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="bold">(b) 1-Loop Self-Energy &amp; Vertex Correction</text>
    <g stroke="#a855f7" stroke-width="2" fill="none">
      <line x1="20" y1="100" x2="70" y2="100" />
      <circle cx="120" cy="100" r="35" stroke="#38bdf8"/>
      <line x1="170" y1="100" x2="220" y2="100" />
    </g>
    <path d="M 85 100 Q 120 70, 155 100" stroke="#fbbf24" stroke-width="1.8" fill="none" stroke-dasharray="3,3"/>
    <text x="105" y="60" fill="#fbbf24" font-size="11" font-family="sans-serif">W⁺ / Z⁰</text>
    <text x="110" y="145" fill="#38bdf8" font-size="11" font-family="sans-serif">Fermion Loop</text>
  </g>
</svg>
